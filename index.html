<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wunschbaum">
<meta name="theme-color" content="#08090b">
<title>Wunschbaum</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  @supports (height: 100dvh) { html, body { height: 100dvh; } }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff; color: #16181d; display: flex; flex-direction: column;
    -webkit-text-size-adjust: 100%; overscroll-behavior: none;
  }

  /* ---------- Header ---------- */
  header {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top));
    border-bottom: 1px solid #e6e8ec; background: #fff; z-index: 30; position: relative;
  }
  h1 { font-size: 16px; margin: 0 12px 0 0; font-weight: 600; letter-spacing: -.2px; }
  button {
    font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 8px;
    border: 1px solid #d7dae0; background: #fff; color: #16181d; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:hover { background: #f4f5f7; }
  button.primary { background: #16181d; color: #fff; border-color: #16181d; }
  button.primary:hover { background: #34383f; }
  button.active { background: #16181d; color: #fff; border-color: #16181d; }
  button.ghost { border-color: transparent; color: #6b7280; }
  button.ghost:hover { background: #f4f5f7; }
  .spacer { flex: 1; }
  #more { display: contents; }
  #btnMore { display: none; }

  /* ---------- Layout ---------- */
  main { flex: 1; display: flex; min-height: 0; }
  #canvasWrap {
    flex: 1; overflow: auto; position: relative;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }
  #canvasScale { position: relative; }
  #canvas {
    position: absolute; top: 0; left: 0; width: 2400px; height: 1800px;
    transform-origin: 0 0;
    background-color: #fff;
    background-image:
      linear-gradient(rgba(22,24,29,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(22,24,29,.055) 1px, transparent 1px),
      linear-gradient(rgba(22,24,29,.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(22,24,29,.10) 1px, transparent 1px);
    background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px;
  }
  #lines { position: absolute; inset: 0; width: 100%; height: 100%; }
  #lines line { stroke: #9aa2ae; stroke-width: 2.5; }
  #lines line.hit { stroke: transparent; stroke-width: 20; cursor: pointer; pointer-events: stroke; }

  /* ---------- Zoom-Leiste ---------- */
  #zoomBar {
    position: fixed; left: 12px; bottom: 12px;
    bottom: max(12px, env(safe-area-inset-bottom)); z-index: 15;
    display: flex; align-items: center; gap: 4px;
    background: rgba(255,255,255,.94); border: 1px solid #e0e3e8; border-radius: 10px;
    padding: 4px; box-shadow: 0 3px 10px rgba(22,24,29,.14);
    backdrop-filter: blur(6px);
  }
  #zoomBar button { padding: 6px 10px; font-size: 14px; line-height: 1; border-color: transparent; }
  #zVal { font-size: 11px; color: #6b7280; min-width: 38px; text-align: center; }

  /* ---------- Post-it Grundlook ---------- */
  .postit { position: relative; border-radius: 3px; }
  .postit::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 15px;
    background: linear-gradient(180deg, rgba(255,255,255,.7), rgba(255,255,255,0));
    border-bottom: 1px solid rgba(0,0,0,.055);
    box-shadow: 0 4px 6px -4px rgba(0,0,0,.45);
    transform: perspective(28px) rotateX(4deg);
    transform-origin: top center;
    border-radius: 3px 3px 0 0; pointer-events: none;
  }
  .postit::after {
    content: ""; position: absolute; right: 0; bottom: 0;
    border-width: 0 0 16px 16px; border-style: solid;
    border-color: transparent transparent rgba(0,0,0,.07) transparent;
    pointer-events: none;
  }

  /* ---------- Personen-Post-its ---------- */
  .person {
    position: absolute; width: 200px;
    background: #fdf0a6;
    padding: 20px 12px 12px; cursor: grab; user-select: none; -webkit-user-select: none;
    touch-action: none;
    box-shadow: 0 8px 16px -8px rgba(22,24,29,.45), 0 2px 4px rgba(22,24,29,.1);
  }
  .person:active { cursor: grabbing; }
  .person.sel { outline: 2.5px solid #4f46e5; outline-offset: 2px; }
  .person.link1 { outline: 2.5px dashed #4f46e5; outline-offset: 2px; }
  .person .nm { font-weight: 700; font-size: 15px; line-height: 1.2; }
  .person .rl { font-size: 11px; color: #7a6a1f; margin-top: 2px; }
  .person .wishes { margin-top: 9px; display: flex; flex-direction: column; gap: 5px; }
  .person .none { font-size: 11px; color: #9a8b3f; margin-top: 8px; font-style: italic; }

  .mini {
    background: #eafbe7; border-radius: 3px; padding: 7px 8px 6px;
    box-shadow: 0 2px 3px -1px rgba(22,24,29,.22);
    background-image: linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,0) 12px);
    cursor: pointer; position: relative;
  }
  .mini.u { background-color: #f6e8fd; border: 1px dashed rgba(107,33,168,.4); }
  .mini.done { opacity: .5; }
  .mini .mt { font-size: 12px; line-height: 1.3; word-break: break-word; }
  .mini.done .mt { text-decoration: line-through; }
  .mini .mn { font-size: 10.5px; color: #4b5563; margin-top: 3px; line-height: 1.3; font-style: italic; }
  .mini .mo { font-size: 9.5px; margin-top: 3px; letter-spacing: .3px; text-transform: uppercase; opacity: .65; }
  .moreBtn {
    font-size: 11px; padding: 5px 9px; border-radius: 6px; align-self: flex-start;
    border: 1px solid rgba(22,24,29,.18); background: rgba(255,255,255,.6); cursor: pointer;
  }

  /* ---------- Seitenleiste ---------- */
  aside {
    width: 360px; flex: 0 0 360px; border-left: 1px solid #e6e8ec;
    display: flex; flex-direction: column; min-height: 0; background: #fff;
  }
  .sideHead { padding: 12px 14px 10px; border-bottom: 1px solid #eef0f3; position: relative; }
  .sideHead .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .sideHead h2 { font-size: 13px; margin: 0; font-weight: 600; }
  #sideClose { display: none; position: absolute; right: 10px; top: 8px; padding: 4px 10px; font-size: 15px; }
  .chipBtn {
    font-size: 12px; padding: 5px 10px; border-radius: 999px;
    border: 1px solid #d7dae0; background: #fff; cursor: pointer;
  }
  .chipBtn.on { background: #16181d; color: #fff; border-color: #16181d; }
  #wishList { flex: 1; overflow: auto; padding: 14px; background: #fafbfc; -webkit-overflow-scrolling: touch; }

  .wish {
    background: #eafbe7; padding: 19px 11px 11px; margin-bottom: 10px;
    box-shadow: 0 6px 12px -7px rgba(22,24,29,.45), 0 1px 3px rgba(22,24,29,.1);
  }
  .wish.unreal { background: #f6e8fd; }
  .wish.done { opacity: .5; }
  .wish .txt { font-size: 13.5px; line-height: 1.35; font-weight: 500; }
  .wish.done .txt { text-decoration: line-through; }
  .wish .note { font-size: 12px; color: #4b5563; margin-top: 5px; line-height: 1.35; font-style: italic; }
  .wish .meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; align-items: center; }
  .tag { font-size: 10.5px; padding: 2px 7px; border-radius: 999px; background: rgba(255,255,255,.7); border: 1px solid rgba(22,24,29,.12); color: #374151; }
  .tag.bday { color: #9a3412; }
  .tag.xmas { color: #166534; }
  .tag.both { color: #1e40af; }
  .wish .acts { display: flex; gap: 4px; margin-top: 9px; }
  .wish .acts button { font-size: 11.5px; padding: 5px 9px; background: rgba(255,255,255,.75); border-color: rgba(22,24,29,.15); }
  .empty { color: #9ca3af; font-size: 13px; padding: 18px 2px; line-height: 1.5; }

  /* ---------- Modal ---------- */
  .backdrop {
    position: fixed; inset: 0; background: rgba(15,17,21,.35);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .modal {
    background: #fff; border-radius: 14px; width: 100%; max-width: 420px;
    max-height: 88vh; overflow: auto; padding: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.2);
    -webkit-overflow-scrolling: touch;
  }
  .modal h3 { margin: 0 0 14px; font-size: 15px; }
  label { display: block; font-size: 12px; color: #6b7280; margin: 12px 0 5px; }
  input[type=text], textarea, select {
    width: 100%; font: inherit; font-size: 14px; padding: 8px 10px;
    border: 1px solid #d7dae0; border-radius: 8px; background: #fff; color: #16181d;
  }
  textarea { min-height: 62px; resize: vertical; }
  .checks { max-height: 170px; overflow: auto; border: 1px solid #e6e8ec; border-radius: 8px; padding: 6px; }
  .checks label { display: flex; align-items: center; gap: 10px; margin: 0; padding: 8px 4px; font-size: 13.5px; color: #16181d; cursor: pointer; }
  .checks input { margin: 0; width: 18px; height: 18px; }
  .segs { display: flex; gap: 6px; }
  .segs button { flex: 1; }
  .modalActs { display: flex; gap: 8px; margin-top: 18px; }
  .danger { color: #b91c1c; border-color: #fecaca; }
  .danger:hover { background: #fef2f2; }
  .hint { font-size: 11.5px; color: #9ca3af; margin-top: 6px; line-height: 1.4; }

  /* ---------- Seitenleiste einklappen ---------- */
  body.noside aside { display: none; }

  /* ================= HANDY ================= */
  @media (max-width: 860px) {
    header { gap: 6px; padding: 8px 10px; padding-top: max(8px, env(safe-area-inset-top)); }
    h1 { font-size: 15px; margin-right: 4px; width: 100%; }
    header button { font-size: 13px; padding: 8px 11px; }
    .spacer { display: none; }

    /* Selten gebrauchte Buttons in ein Menue */
    #btnMore { display: inline-block; margin-left: auto; }
    #more {
      display: none; position: absolute; right: 10px; top: calc(100% - 4px);
      background: #fff; border: 1px solid #e0e3e8; border-radius: 10px; padding: 6px;
      box-shadow: 0 8px 24px rgba(22,24,29,.18); z-index: 40;
      flex-direction: column; gap: 2px; min-width: 160px;
    }
    #more.open { display: flex; }
    #more button { text-align: left; width: 100%; color: #16181d; }

    /* Seitenleiste als Overlay von unten */
    main { flex-direction: column; }
    aside {
      position: fixed; left: 0; right: 0; bottom: 0; width: auto; flex: none;
      height: 64dvh; z-index: 25;
      border-left: none; border-top: 1px solid #e0e3e8;
      border-radius: 14px 14px 0 0;
      box-shadow: 0 -8px 30px rgba(22,24,29,.22);
      padding-bottom: env(safe-area-inset-bottom);
    }
    #sideClose { display: block; }
    .sideHead { padding-right: 62px; }

    /* iOS zoomt bei Feldern unter 16px automatisch rein */
    input[type=text], textarea, select { font-size: 16px; }

    /* Modale als Sheet von unten */
    .backdrop { align-items: flex-end; padding: 0; }
    .modal {
      max-width: 100%; border-radius: 16px 16px 0 0; max-height: 88dvh;
      padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    }
    .modalActs button { padding: 10px 12px; }
    .segs button { padding: 10px 6px; }
  }

  /* ---------- Druck / PDF ---------- */
  #printArea { display: none; }
  @media print {
    @page { size: A4; margin: 15mm 14mm; }
    html, body { height: auto; display: block; background: #fff; }
    body > * { display: none !important; }
    body > #printArea { display: block !important; }
    #printArea { font-size: 11pt; color: #000; }
    #printArea h1 { font-size: 19pt; margin: 0 0 2mm; }
    #printArea .pDate { font-size: 9pt; color: #555; margin-bottom: 8mm; }
    #printArea .pPerson { break-inside: avoid; page-break-inside: avoid; margin-bottom: 7mm; }
    #printArea .pName {
      font-size: 13pt; font-weight: 700; border-bottom: 1.2pt solid #000;
      padding-bottom: 1.5mm; margin-bottom: 3mm;
    }
    #printArea .pName span { font-weight: 400; font-size: 10pt; color: #555; }
    #printArea .pRow { display: flex; gap: 3mm; margin-bottom: 3mm; break-inside: avoid; page-break-inside: avoid; }
    #printArea .pBox {
      flex: 0 0 auto; width: 4.5mm; height: 4.5mm; border: 1pt solid #444;
      border-radius: 1mm; margin-top: 1mm;
    }
    #printArea .pTxt { font-size: 11.5pt; line-height: 1.3; }
    #printArea .pTxt.done { text-decoration: line-through; color: #777; }
    #printArea .pNote { font-size: 9.5pt; color: #444; font-style: italic; margin-top: .8mm; }
    #printArea .pTags { font-size: 8.5pt; color: #555; margin-top: .8mm; letter-spacing: .2pt; }
    #printArea .pFoot { margin-top: 8mm; font-size: 8.5pt; color: #888; border-top: .5pt solid #ccc; padding-top: 2mm; }
  }

  /* ==================================================================
     DUNKLES DESIGN – nur am Bildschirm. Der Ausdruck bleibt schwarz
     auf weiß, damit das PDF nicht die ganze Patrone leersaugt.
     ================================================================== */
  @media screen {
    :root {
      color-scheme: dark;
      --bg: #08090b;
      --txt: #e9ebee;
      --muted: #8b919b;
      --line: rgba(255,255,255,.10);
      --glass: rgba(255,255,255,.055);
      --glass-hi: rgba(255,255,255,.09);
      --real: #34d399;
      --unreal: #a78bfa;
    }

    html, body { background: var(--bg); color: var(--txt); }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.24); background-clip: content-box; }
    ::-webkit-scrollbar-track { background: transparent; }
    * { scrollbar-color: rgba(255,255,255,.16) transparent; scrollbar-width: thin; }

    /* ---------- Kopfzeile ---------- */
    header {
      background: rgba(12,13,16,.72);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      backdrop-filter: blur(20px) saturate(160%);
      border-bottom: 1px solid var(--line);
    }
    h1 { color: var(--txt); font-weight: 590; }

    button {
      background: var(--glass);
      border: 1px solid var(--line);
      color: var(--txt);
      border-radius: 9px;
      transition: background .15s ease, border-color .15s ease;
    }
    button:hover { background: var(--glass-hi); border-color: rgba(255,255,255,.16); }
    button.primary { background: #f2f3f5; color: #0b0c0e; border-color: transparent; font-weight: 560; }
    button.primary:hover { background: #fff; }
    button.active { background: #f2f3f5; color: #0b0c0e; border-color: transparent; }
    button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
    button.ghost:hover { background: var(--glass); color: var(--txt); }
    button.danger, .danger { color: #f87171; border-color: rgba(248,113,113,.28); }
    button.danger:hover, .danger:hover { background: rgba(248,113,113,.12); }

    /* ---------- Fläche: schwarz mit Punktraster ---------- */
    #canvasWrap { background: var(--bg); }
    #canvas {
      background-color: var(--bg);
      background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.085) 1px, transparent 0);
      background-size: 22px 22px;
    }
    /* Der Schein unter der Maus: hellere Punkte + weicher Lichtkegel */
    #glow {
      position: absolute; inset: 0; pointer-events: none; z-index: 0;
      opacity: 0; transition: opacity .35s ease;
      --mx: -1000px; --my: -1000px; --r: 210px;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(255,255,255,.55) 1px, transparent 0),
        radial-gradient(circle var(--r) at var(--mx) var(--my), rgba(255,255,255,.07), transparent 70%);
      background-size: 22px 22px, 100% 100%;
      -webkit-mask-image: radial-gradient(circle var(--r) at var(--mx) var(--my), #000 0%, rgba(0,0,0,.45) 40%, transparent 72%);
      mask-image: radial-gradient(circle var(--r) at var(--mx) var(--my), #000 0%, rgba(0,0,0,.45) 40%, transparent 72%);
    }
    #lines line { stroke: rgba(255,255,255,.22); stroke-width: 1.5; }

    /* ---------- Karten: dunkles Glas ---------- */
    .postit::before, .postit::after { display: none; }
    .postit { border-radius: 14px; }

    .person {
      background: var(--glass);
      -webkit-backdrop-filter: blur(16px) saturate(150%);
      backdrop-filter: blur(16px) saturate(150%);
      border: 1px solid var(--line);
      padding: 13px 13px 12px;
      color: var(--txt);
      box-shadow: 0 14px 34px -18px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.05);
      transition: border-color .15s ease, background .15s ease;
    }
    .person:hover { border-color: rgba(255,255,255,.18); background: rgba(255,255,255,.07); }
    .person.sel { outline: none; border-color: rgba(255,255,255,.55); box-shadow: 0 14px 34px -18px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.35); }
    .person.link1 { outline: none; border-color: var(--unreal); box-shadow: 0 0 0 1px var(--unreal), 0 0 22px -6px var(--unreal); }
    .person .nm { color: var(--txt); font-weight: 600; letter-spacing: -.2px; }
    .person .rl { color: var(--muted); }
    .person .none { color: rgba(255,255,255,.28); }

    .mini {
      background: rgba(255,255,255,.045);
      background-image: none;
      border: 1px solid rgba(255,255,255,.07);
      border-left: 2px solid var(--real);
      border-radius: 9px;
      box-shadow: none;
      transition: background .15s ease;
    }
    .mini:hover { background: rgba(255,255,255,.085); }
    .mini.u { background-color: rgba(167,139,250,.07); border: 1px solid rgba(167,139,250,.16); border-left: 2px solid var(--unreal); }
    .mini .mt { color: var(--txt); }
    .mini .mn { color: var(--muted); }
    .mini .mo { color: rgba(255,255,255,.32); opacity: 1; }
    .moreBtn { background: rgba(255,255,255,.05); border: 1px solid var(--line); color: var(--muted); }
    .moreBtn:hover { background: rgba(255,255,255,.1); color: var(--txt); }

    /* ---------- Zoom-Leiste ---------- */
    #zoomBar {
      background: rgba(18,19,23,.78);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      backdrop-filter: blur(18px) saturate(160%);
      border: 1px solid var(--line);
      box-shadow: 0 10px 30px -12px rgba(0,0,0,.9);
    }
    #zVal { color: var(--muted); }

    /* ---------- Seitenleiste ---------- */
    aside { background: rgba(12,13,16,.86); border-left: 1px solid var(--line); }
    .sideHead { border-bottom: 1px solid var(--line); }
    .sideHead h2 { color: var(--txt); font-weight: 590; }
    #wishList { background: transparent; }
    .chipBtn { background: transparent; border: 1px solid var(--line); color: var(--muted); }
    .chipBtn:hover { background: var(--glass); color: var(--txt); }
    .chipBtn.on { background: #f2f3f5; color: #0b0c0e; border-color: transparent; }

    .wish {
      background: var(--glass);
      -webkit-backdrop-filter: blur(14px) saturate(150%);
      backdrop-filter: blur(14px) saturate(150%);
      border: 1px solid var(--line);
      border-left: 2px solid var(--real);
      border-radius: 12px;
      padding: 12px 12px 11px;
      box-shadow: none;
    }
    .wish.unreal { background: rgba(167,139,250,.06); border-color: rgba(167,139,250,.16); border-left-color: var(--unreal); }
    .wish .txt { color: var(--txt); font-weight: 500; }
    .wish .note { color: var(--muted); }
    .tag { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.07); color: var(--muted); }
    .tag.bday { color: #fbbf24; }
    .tag.xmas { color: #4ade80; }
    .tag.both { color: #7dd3fc; }
    .wish .acts button { background: rgba(255,255,255,.05); border-color: var(--line); color: var(--txt); }
    .wish .acts button:hover { background: rgba(255,255,255,.1); }
    .wish .acts button.danger { color: #f87171; border-color: rgba(248,113,113,.24); }
    .empty { color: rgba(255,255,255,.3); }

    /* ---------- Fenster ---------- */
    .backdrop { background: rgba(0,0,0,.6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    .modal {
      background: rgba(22,23,27,.92);
      -webkit-backdrop-filter: blur(28px) saturate(170%);
      backdrop-filter: blur(28px) saturate(170%);
      border: 1px solid var(--line);
      border-radius: 16px;
      color: var(--txt);
      box-shadow: 0 30px 70px -20px rgba(0,0,0,.95);
    }
    .modal h3 { color: var(--txt); font-weight: 590; }
    label { color: var(--muted); }
    input[type=text], textarea, select {
      background: rgba(255,255,255,.05);
      border: 1px solid var(--line);
      color: var(--txt);
      border-radius: 9px;
    }
    input[type=text]:focus, textarea:focus {
      outline: none;
      border-color: rgba(255,255,255,.3);
      background: rgba(255,255,255,.08);
    }
    input[type=text]::placeholder, textarea::placeholder { color: rgba(255,255,255,.26); }
    .checks { background: rgba(255,255,255,.03); border: 1px solid var(--line); }
    .checks label { color: var(--txt); border-radius: 7px; }
    .checks label:hover { background: rgba(255,255,255,.05); }
    .checks input { accent-color: #f2f3f5; }
    .hint { color: rgba(255,255,255,.32); }

    #more { background: rgba(22,23,27,.95); border-color: var(--line); box-shadow: 0 20px 50px -18px rgba(0,0,0,.95); }
    #more button { color: var(--txt); }
  }

  /* ========== Countdown, Preise, Links, Bilder ========== */
  @media screen {
    #countdown {
      font-size: 11.5px; color: var(--muted); margin-left: 6px;
      white-space: nowrap; letter-spacing: .1px;
    }

    /* Preis */
    .mini .pr, .wish .pr { font-weight: 650; color: #d7dbe0; }
    .mini .pr { font-size: 11.5px; margin-top: 3px; }
    .wish .pr { font-size: 12.5px; margin-top: 4px; }
    #sumBox {
      margin-top: 9px; font-size: 12px; color: var(--muted);
      display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline;
    }
    #sumBox b { color: var(--txt); font-weight: 650; }
    #sumBox .sep { opacity: .35; }
    .person .psum { font-size: 11px; color: var(--muted); margin-top: 3px; }

    /* anklickbare Links */
    a.wlink {
      color: #7dd3fc; text-decoration: none;
      border-bottom: 1px solid rgba(125,211,252,.35);
      word-break: break-all; cursor: pointer;
    }
    a.wlink:hover { border-bottom-color: #7dd3fc; }

    /* Bilder */
    .thumb {
      display: block; width: 100%; height: 84px; object-fit: cover;
      border-radius: 7px; margin-top: 7px; cursor: zoom-in;
      border: 1px solid rgba(255,255,255,.08);
    }
    .wish .thumb { height: 120px; }
    .imgRow { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
    .imgPrev {
      width: 62px; height: 62px; object-fit: cover; border-radius: 9px;
      border: 1px solid var(--line); flex: 0 0 auto;
    }
    .imgRow .imgTxt { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
    .imgRow button { font-size: 12px; padding: 6px 10px; }
    #lightbox {
      position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.88);
      display: flex; align-items: center; justify-content: center; padding: 24px; cursor: zoom-out;
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    }
    #lightbox img { max-width: 90vw; max-height: 86vh; border-radius: 14px; box-shadow: 0 30px 80px rgba(0,0,0,.9); }
  }

  @media print {
    #printArea .pPrice { font-size: 10pt; color: #111; font-weight: 600; margin-top: .6mm; }
    #printArea .pImg { max-width: 34mm; max-height: 24mm; margin-top: 1.2mm; border: .5pt solid #bbb; border-radius: 1mm; }
  }
</style>
</head>
<body>

<header>
  <h1>Wunschbaum</h1>
  <button class="primary" id="btnAddPerson">+ Person</button>
  <button id="btnAddWish">+ Wunsch</button>
  <button id="btnLink">Verbinden</button>
  <button id="btnSide">Liste</button>
  <span id="countdown"></span>
  <span class="spacer"></span>
  <button id="btnMore" aria-label="Mehr">•••</button>
  <div id="more">
    <button class="ghost" id="btnShare">Link kopieren</button>
    <button class="ghost" id="btnShareBig">Großer Link mit Bildern</button>
    <button class="ghost" id="btnPaste">Link einfügen</button>
    <button class="ghost" id="btnPdf">PDF</button>
    <button class="ghost" id="btnExport">Backup</button>
    <button class="ghost" id="btnImport">Import</button>
  </div>
  <input type="file" id="fileIn" accept="application/json" hidden>
</header>

<div id="printArea"></div>

<main>
  <div id="canvasWrap">
    <div id="canvasScale">
      <div id="canvas"><div id="glow"></div><svg id="lines"></svg></div>
    </div>
    <div id="zoomBar">
      <button id="zOut" aria-label="Kleiner">−</button>
      <span id="zVal">100%</span>
      <button id="zIn" aria-label="Größer">+</button>
      <button id="zFit" aria-label="Alles zeigen">Alles</button>
    </div>
  </div>

  <aside>
    <div class="sideHead">
      <button id="sideClose" aria-label="Liste schließen">✕</button>
      <h2 id="sideTitle">Alle Wünsche</h2>
      <div class="row" id="filterOcc">
        <button class="chipBtn on" data-occ="all">Alle</button>
        <button class="chipBtn" data-occ="bday">Geburtstag</button>
        <button class="chipBtn" data-occ="xmas">Weihnachten</button>
      </div>
      <div class="row" id="filterType">
        <button class="chipBtn on" data-type="all">Alle</button>
        <button class="chipBtn" data-type="real">Realistisch</button>
        <button class="chipBtn" data-type="unreal">Unrealistisch</button>
        <button class="chipBtn ghost" id="btnClearPerson" style="display:none">Personen-Filter aus</button>
      </div>
      <div class="row" id="filterDone">
        <button class="chipBtn on" data-done="all">Alle</button>
        <button class="chipBtn" data-done="open">Offen</button>
        <button class="chipBtn" data-done="done">Erledigt</button>
      </div>
      <div id="sumBox"></div>
    </div>
    <div id="wishList"></div>
  </aside>
</main>

<script>
"use strict";

/* ================= State ================= */
const KEY = "wunschbaum_v1";
// v2: neuer Schluessel, damit die Liste auch bei alten Besuchern einmal zugeklappt startet
const UIKEY = "wunschbaum_ui_side_v2";
const ZKEY = "wunschbaum_ui_zoom";
const EXKEY = "wunschbaum_ui_expanded";
const MAX_VISIBLE = 3;
const BASE_W = 2400, BASE_H = 1800;

let state = { people: [], links: [], wishes: [] };
let mode = "normal";
let linkFirst = null;
let selPerson = null;
let fOcc = "all", fType = "all", fDone = "all";
let zoom = 1;
const expanded = new Set();

const uid = () => Math.random().toString(36).slice(2, 10);
const $ = id => document.getElementById(id);
const spacerEl = () => { const s = document.createElement("span"); s.className = "spacer"; return s; };
const isPhone = () => {
  try {
    if (window.matchMedia) return window.matchMedia("(max-width: 860px)").matches;
  } catch (e) {}
  return (window.innerWidth || 1200) <= 860;
};

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      state = {
        people: Array.isArray(d.people) ? d.people : [],
        links:  Array.isArray(d.links)  ? d.links  : [],
        wishes: Array.isArray(d.wishes) ? d.wishes : []
      };
      state.wishes.forEach(w => { if (typeof w.note !== "string") w.note = ""; });
      if (migratePrices()) save();
    }
  } catch (e) { console.warn("Laden fehlgeschlagen", e); }
}

let warned = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) {
    console.warn("Speichern fehlgeschlagen", e);
    if (!warned) {
      warned = true;
      const b = document.createElement("div");
      b.style.cssText = "background:#fef2f2;color:#991b1b;border-bottom:1px solid #fecaca;padding:8px 14px;font-size:12.5px";
      b.textContent = "Achtung: Dieser Browser speichert nichts automatisch. Nutze „Backup“, sonst sind deine Daten beim Schließen weg.";
      document.body.insertBefore(b, document.body.firstChild);
    }
  }
}

const personById = id => state.people.find(p => p.id === id);
const wishById   = id => state.wishes.find(w => w.id === id);
const OCC = { bday: ["Geburtstag", "bday"], xmas: ["Weihnachten", "xmas"], both: ["Geb. + Weihn.", "both"] };

/* ================= Preise ================= */
function fmtPreis(n) {
  if (n === null || n === undefined || isNaN(n)) return "";
  return Number(n).toLocaleString("de-AT", { maximumFractionDigits: 2 }) + " €";
}
function preisAus(t) {
  if (!t) return null;
  const s = String(t);
  let m = s.match(/(\d+(?:[.,]\d+)?)\s*k\b/i);
  if (m) return Math.round(parseFloat(m[1].replace(",", ".")) * 1000);
  m = s.match(/(\d+(?:[.,]\d+)?)\s*(?:€|eur\b|euro\b|\$|usd\b)/i);
  if (m) return Math.round(parseFloat(m[1].replace(",", ".")) * 100) / 100;
  m = s.match(/(?:€|\$)\s*(\d+(?:[.,]\d+)?)/);
  if (m) return Math.round(parseFloat(m[1].replace(",", ".")) * 100) / 100;
  return null;
}
function preisEingabe(s) {
  s = (s || "").trim();
  if (!s) return null;
  if (/^[\d.,\s]+$/.test(s)) {
    const n = parseFloat(s.replace(/\s/g, "").replace(/\.(?=\d{3}\b)/g, "").replace(",", "."));
    return isNaN(n) ? null : Math.round(n * 100) / 100;
  }
  return preisAus(s);
}
function notizOhnePreis(t) {
  let s = String(t || "")
    .replace(/(\d+(?:[.,]\d+)?)\s*k\b/i, "")
    .replace(/(\d+(?:[.,]\d+)?)\s*(?:€|eur\b|euro\b|\$|usd\b)/i, "")
    .replace(/(?:€|\$)\s*(\d+(?:[.,]\d+)?)/, "");
  s = s.replace(/^[\s\-–—:,;.]+|[\s\-–—:,;.]+$/g, "");
  s = s.replace(/^\(\s*/, "").replace(/\s*\)$/, "");
  return s.replace(/\s{2,}/g, " ").trim();
}
/* Holt Preise aus alten Notizen. Lange Notizen bleiben unangetastet,
   der Titel wird nur gelesen, nie verändert. */
function migratePrices() {
  let geaendert = false;
  state.wishes.forEach(w => {
    if (w.price !== undefined) return;
    geaendert = true;
    const note = String(w.note || "");
    let p = null;
    if (note.length <= 25) {
      p = preisAus(note);
      if (p !== null) w.note = notizOhnePreis(note);
    }
    if (p === null) p = preisAus(w.text);
    w.price = p;
  });
  return geaendert;
}

/* ================= Links im Text ================= */
function textMitLinks(t) {
  const frag = document.createDocumentFragment();
  const re = /(https?:\/\/[^\s<>"')]+)/g;
  let last = 0, m;
  while ((m = re.exec(t)) !== null) {
    if (m.index > last) frag.appendChild(document.createTextNode(t.slice(last, m.index)));
    const a = document.createElement("a");
    a.className = "wlink";
    a.href = m[0];
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = m[0].length > 48 ? m[0].slice(0, 46) + "…" : m[0];
    a.addEventListener("pointerdown", e => e.stopPropagation());
    a.addEventListener("click", e => e.stopPropagation());
    frag.appendChild(a);
    last = m.index + m[0].length;
  }
  if (last < t.length) frag.appendChild(document.createTextNode(t.slice(last)));
  return frag;
}

/* ================= Bilder ================= */
const BILD_MAX = 480, BILD_QUAL = 0.72;
function bildVerkleinern(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = () => rej(new Error("Datei nicht lesbar"));
    r.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error("Das ist kein Bild, das ich lesen kann"));
      img.onload = () => {
        let bw = img.width, bh = img.height;
        const f = Math.min(1, BILD_MAX / Math.max(bw, bh));
        bw = Math.max(1, Math.round(bw * f));
        bh = Math.max(1, Math.round(bh * f));
        const c = document.createElement("canvas");
        c.width = bw; c.height = bh;
        c.getContext("2d").drawImage(img, 0, 0, bw, bh);
        res(c.toDataURL("image/jpeg", BILD_QUAL));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
function zeigeBild(src) {
  const bx = document.createElement("div");
  bx.id = "lightbox";
  const im = document.createElement("img");
  im.src = src;
  bx.appendChild(im);
  const zu = () => { bx.remove(); document.removeEventListener("keydown", esc); };
  const esc = e => { if (e.key === "Escape") zu(); };
  bx.addEventListener("click", zu);
  document.addEventListener("keydown", esc);
  document.body.appendChild(bx);
}
function thumbNode(w) {
  if (!w.img) return null;
  const im = document.createElement("img");
  im.className = "thumb";
  im.src = w.img;
  im.alt = "";
  im.addEventListener("pointerdown", e => e.stopPropagation());
  im.addEventListener("click", e => { e.stopPropagation(); zeigeBild(w.img); });
  return im;
}

/* ================= Countdown ================= */
function tageBis(monat, tag) {
  const j = new Date();
  const heute = new Date(j.getFullYear(), j.getMonth(), j.getDate());
  let ziel = new Date(heute.getFullYear(), monat - 1, tag);
  if (ziel < heute) ziel = new Date(heute.getFullYear() + 1, monat - 1, tag);
  return Math.round((ziel - heute) / 86400000);
}
function renderCountdown() {
  const t = n => n === 0 ? "ist heute" : (n === 1 ? "ist morgen" : "in " + n + " Tagen");
  $("countdown").textContent = "Geburtstag " + t(tageBis(12, 17)) + "  ·  Weihnachten " + t(tageBis(12, 24));
}

function rotOf(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0;
  return (((h % 7) + 7) % 7 - 3) * 0.5;
}

/* ================= Zoom ================= */
const canvas = $("canvas");
const canvasScale = $("canvasScale");
const wrap = $("canvasWrap");
const svg = $("lines");

function applyZoom(z, keepCenter) {
  const old = zoom;
  zoom = Math.min(2, Math.max(0.2, z));

  let cx = 0, cy = 0;
  if (keepCenter) {
    cx = (wrap.scrollLeft + wrap.clientWidth / 2) / old;
    cy = (wrap.scrollTop + wrap.clientHeight / 2) / old;
  }

  canvas.style.transform = "scale(" + zoom + ")";
  canvasScale.style.width = (BASE_W * zoom) + "px";
  canvasScale.style.height = (BASE_H * zoom) + "px";
  $("zVal").textContent = Math.round(zoom * 100) + "%";

  if (keepCenter) {
    wrap.scrollLeft = cx * zoom - wrap.clientWidth / 2;
    wrap.scrollTop = cy * zoom - wrap.clientHeight / 2;
  }
  try { localStorage.setItem(ZKEY, String(zoom)); } catch (e) {}
}

function contentBox() {
  const els = [...canvas.querySelectorAll(".person")];
  if (!els.length) return null;
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  els.forEach(el => {
    const p = personById(el.dataset.id);
    if (!p) return;
    x1 = Math.min(x1, p.x); y1 = Math.min(y1, p.y);
    x2 = Math.max(x2, p.x + el.offsetWidth);
    y2 = Math.max(y2, p.y + el.offsetHeight);
  });
  if (x1 === Infinity) return null;
  return { x1, y1, x2, y2, w: x2 - x1, h: y2 - y1 };
}

function fitToContent() {
  const b = contentBox();
  if (!b) { applyZoom(1, false); return; }
  const pad = 28;
  const zx = (wrap.clientWidth - pad * 2) / b.w;
  const zy = (wrap.clientHeight - pad * 2) / b.h;
  // Nicht kleiner als 35 %, sonst kann man nichts mehr lesen
  const z = Math.max(0.35, Math.min(1, zx, zy));
  applyZoom(z, false);
  wrap.scrollLeft = Math.max(0, b.x1 * z - pad);
  wrap.scrollTop = Math.max(0, b.y1 * z - pad);
}

$("zIn").onclick = () => applyZoom(zoom * 1.25, true);
$("zOut").onclick = () => applyZoom(zoom / 1.25, true);
$("zFit").onclick = () => fitToContent();

/* ================= Render: Personen ================= */
function render() { renderPeople(); renderLines(); renderWishes(); renderCountdown(); }

function renderPeople() {
  [...canvas.querySelectorAll(".person")].forEach(n => n.remove());

  state.people.forEach(p => {
    const el = document.createElement("div");
    el.className = "person postit" + (selPerson === p.id ? " sel" : "") + (linkFirst === p.id ? " link1" : "");
    el.style.left = p.x + "px";
    el.style.top = p.y + "px";
    el.dataset.id = p.id;

    const nm = document.createElement("div");
    nm.className = "nm"; nm.textContent = p.name;
    el.appendChild(nm);

    if (p.role) {
      const rl = document.createElement("div");
      rl.className = "rl"; rl.textContent = p.role;
      el.appendChild(rl);
    }

    const my = state.wishes
      .filter(w => w.people.includes(p.id))
      .sort((a, b) => (a.done - b.done) || (b.created - a.created));

    const psum = my.reduce((a, w) => a + (w.price || 0), 0);
    if (psum > 0) {
      const ps = document.createElement("div");
      ps.className = "psum";
      ps.textContent = my.length + " Wünsche · " + fmtPreis(psum);
      el.appendChild(ps);
    }

    if (!my.length) {
      const n = document.createElement("div");
      n.className = "none"; n.textContent = "noch keine Wünsche";
      el.appendChild(n);
    } else {
      const isOpen = expanded.has(p.id);
      const show = isOpen ? my : my.slice(0, MAX_VISIBLE);

      const box = document.createElement("div");
      box.className = "wishes";

      show.forEach(w => {
        const mw = document.createElement("div");
        mw.className = "mini" + (w.realistic ? "" : " u") + (w.done ? " done" : "");
        mw.dataset.wid = w.id;

        const t = document.createElement("div");
        t.className = "mt"; t.textContent = w.text;
        mw.appendChild(t);

        if (w.note) {
          const n = document.createElement("div");
          n.className = "mn";
          n.appendChild(textMitLinks(w.note));
          mw.appendChild(n);
        }

        if (w.price != null) {
          const pr = document.createElement("div");
          pr.className = "pr"; pr.textContent = fmtPreis(w.price);
          mw.appendChild(pr);
        }

        const o = document.createElement("div");
        o.className = "mo";
        o.textContent = (OCC[w.occ] || OCC.bday)[0];
        mw.appendChild(o);

        const th = thumbNode(w);
        if (th) mw.appendChild(th);

        box.appendChild(mw);
      });

      if (my.length > MAX_VISIBLE) {
        const b = document.createElement("button");
        b.className = "moreBtn";
        b.dataset.toggle = p.id;
        b.textContent = isOpen ? "weniger anzeigen" : "+" + (my.length - MAX_VISIBLE) + " weitere";
        box.appendChild(b);
      }
      el.appendChild(box);
    }
    canvas.appendChild(el);
  });
}

function centerOf(id) {
  const el = canvas.querySelector('.person[data-id="' + id + '"]');
  const p = personById(id);
  if (!el || !p) return null;
  return { x: p.x + el.offsetWidth / 2, y: p.y + el.offsetHeight / 2 };
}

function renderLines() {
  svg.innerHTML = "";
  const NS = "http://www.w3.org/2000/svg";
  state.links.forEach(l => {
    const a = centerOf(l.a), b = centerOf(l.b);
    if (!a || !b) return;
    const mk = cls => {
      const ln = document.createElementNS(NS, "line");
      ln.setAttribute("x1", a.x); ln.setAttribute("y1", a.y);
      ln.setAttribute("x2", b.x); ln.setAttribute("y2", b.y);
      if (cls) ln.setAttribute("class", cls);
      return ln;
    };
    svg.appendChild(mk(""));
    const hit = mk("hit");
    hit.addEventListener("click", () => {
      if (confirm("Verbindung löschen?")) {
        state.links = state.links.filter(x => x.id !== l.id);
        save(); render();
      }
    });
    svg.appendChild(hit);
  });
}

/* ================= Render: Seitenleiste ================= */
function renderWishes() {
  const list = $("wishList");
  list.innerHTML = "";

  const p = selPerson ? personById(selPerson) : null;
  $("sideTitle").textContent = p ? "Wünsche von " + p.name : "Alle Wünsche";
  $("btnClearPerson").style.display = p ? "" : "none";

  let ws = state.wishes.slice();
  if (p) ws = ws.filter(w => w.people.includes(p.id));
  if (fOcc !== "all") ws = ws.filter(w => w.occ === fOcc || w.occ === "both");
  if (fType !== "all") ws = ws.filter(w => (fType === "real") === !!w.realistic);
  if (fDone !== "all") ws = ws.filter(w => (fDone === "done") === !!w.done);
  ws.sort((a, b) => (a.done - b.done) || (b.created - a.created));

  // Summen für die gerade sichtbare Auswahl
  const sb = $("sumBox");
  sb.innerHTML = "";
  if (ws.length) {
    const ges = ws.reduce((a, w) => a + (w.price || 0), 0);
    const rea = ws.filter(w => w.realistic).reduce((a, w) => a + (w.price || 0), 0);
    const ohne = ws.filter(w => w.price == null).length;
    const teil = (label, wert) => {
      const s = document.createElement("span");
      s.appendChild(document.createTextNode(label + " "));
      const b = document.createElement("b"); b.textContent = fmtPreis(wert);
      s.appendChild(b);
      return s;
    };
    sb.appendChild(teil(ws.length + " Wünsche ·", ges));
    if (rea !== ges) {
      const sep = document.createElement("span"); sep.className = "sep"; sep.textContent = "|";
      sb.appendChild(sep);
      sb.appendChild(teil("davon realistisch", rea));
    }
    if (ohne) {
      const s = document.createElement("span");
      s.className = "sep";
      s.textContent = ohne + " ohne Preis";
      sb.appendChild(s);
    }
  }

  if (!ws.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = state.wishes.length
      ? "Keine Wünsche für diesen Filter."
      : "Noch keine Wünsche. Lege zuerst Personen an, dann Wünsche.";
    list.appendChild(e);
    return;
  }

  ws.forEach(w => {
    const el = document.createElement("div");
    el.className = "wish postit" + (w.realistic ? "" : " unreal") + (w.done ? " done" : "");

    const t = document.createElement("div");
    t.className = "txt"; t.textContent = w.text;
    el.appendChild(t);

    if (w.note) {
      const n = document.createElement("div");
      n.className = "note";
      n.appendChild(textMitLinks(w.note));
      el.appendChild(n);
    }

    if (w.price != null) {
      const pr = document.createElement("div");
      pr.className = "pr"; pr.textContent = fmtPreis(w.price);
      el.appendChild(pr);
    }

    const th = thumbNode(w);
    if (th) el.appendChild(th);

    const meta = document.createElement("div");
    meta.className = "meta";

    const occ = OCC[w.occ] || OCC.bday;
    const to = document.createElement("span");
    to.className = "tag " + occ[1]; to.textContent = occ[0];
    meta.appendChild(to);

    const tt = document.createElement("span");
    tt.className = "tag";
    tt.textContent = w.realistic ? "realistisch" : "unrealistisch";
    meta.appendChild(tt);

    w.people.forEach(pid => {
      const per = personById(pid);
      if (!per) return;
      const s = document.createElement("span");
      s.className = "tag"; s.textContent = per.name;
      meta.appendChild(s);
    });
    el.appendChild(meta);

    const acts = document.createElement("div");
    acts.className = "acts";
    const bd = document.createElement("button");

/* ================= Ziehen + Tippen ================= */
let drag = null;
let longPress = null;

function toCanvas(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / zoom, y: (e.clientY - r.top) / zoom };
}

canvas.addEventListener("pointerdown", e => {
  const el = e.target.closest(".person");
  if (!el) return;
  const p = personById(el.dataset.id);
  if (!p) return;

  const pt = toCanvas(e);
  const mini = e.target.closest(".mini");
  const more = e.target.closest(".moreBtn");
  drag = {
    id: p.id, el, moved: false,
    dx: pt.x - p.x, dy: pt.y - p.y,
    wid: mini ? mini.dataset.wid : null,
    toggle: more ? more.dataset.toggle : null
  };
  try { el.setPointerCapture(e.pointerId); } catch (err) {}

  // Langes Draufhalten auf die Karte = Person bearbeiten (Handy-Ersatz fuer Doppelklick)
  clearTimeout(longPress);
  if (!mini && !more) {
    longPress = setTimeout(() => {
      if (drag && !drag.moved) { const q = personById(drag.id); drag = null; if (q) personModal(q); }
    }, 550);
  }
});

canvas.addEventListener("pointermove", e => {
  if (!drag) return;
  const p = personById(drag.id);
  if (!p) return;
  const pt = toCanvas(e);
  const nx = Math.max(0, Math.min(BASE_W - drag.el.offsetWidth, pt.x - drag.dx));
  const ny = Math.max(0, Math.min(BASE_H - drag.el.offsetHeight, pt.y - drag.dy));
  if (Math.abs(nx - p.x) > 3 || Math.abs(ny - p.y) > 3) { drag.moved = true; clearTimeout(longPress); }
  p.x = nx; p.y = ny;
  drag.el.style.left = nx + "px";
  drag.el.style.top = ny + "px";
  renderLines();
});

function endDrag() {
  clearTimeout(longPress);
  if (!drag) return;
  const d = drag;
  drag = null;
  if (d.moved) { save(); return; }

  if (mode === "link") {
    if (!linkFirst) { linkFirst = d.id; renderPeople(); return; }
    if (linkFirst === d.id) { linkFirst = null; renderPeople(); return; }
    const dup = state.links.some(l =>
      (l.a === linkFirst && l.b === d.id) || (l.a === d.id && l.b === linkFirst));
    if (!dup) state.links.push({ id: uid(), a: linkFirst, b: d.id });
    linkFirst = null; save(); render();
    return;
  }

  if (d.toggle) {
    expanded.has(d.toggle) ? expanded.delete(d.toggle) : expanded.add(d.toggle);
    saveExpanded();
    renderPeople(); renderLines();
    return;
  }
  if (d.wid) { const w = wishById(d.wid); if (w) { wishModal(w); return; } }

  selPerson = (selPerson === d.id) ? null : d.id;
  render();
  if (selPerson && isPhone()) setSide(false);
}

canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", () => { clearTimeout(longPress); drag = null; });

let glowQueued = false, glowPt = null;
function paintGlow() {

}

/* ---- Teilen-Link: alle Daten stecken hinter dem # im Link ----
   Alles hinter dem # bleibt im Browser und wird nie an einen Server geschickt. */
const WEB_BASE = "https://casparkletzer-commits.github.io/wishboard/";

function b64url(u8) {
  let s = "";
  for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192));
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function unb64url(str) {
  let s = str.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  const bin = atob(s);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}

async function packState(mitBildern) {
  const payload = {
    v: 1,
    people: state.people,
    links: state.links,
    wishes: mitBildern ? state.wishes : state.wishes.map(w => {
      if (!w.img) return w;
      const k = Object.assign({}, w);
      delete k.img;
      return k;
    }),
    expanded: [...expanded]
  };
  const bytes = new TextEncoder().encode(JSON.stringify(payload));
  if (window.CompressionStream) {
    try {
      const st = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
      return "z" + b64url(new Uint8Array(await new Response(st).arrayBuffer()));
    } catch (e) {}
  }
  return "r" + b64url(bytes);
}

async function unpackState(code) {
  const kind = code[0];
  let bytes = unb64url(code.slice(1));
  if (kind === "z") {
    const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    bytes = new Uint8Array(await new Response(st).arrayBuffer());
  } else if (kind !== "r") {
    throw new Error("unbekanntes Format");
  }
  const d = JSON.parse(new TextDecoder().decode(bytes));
  if (!d || !Array.isArray(d.people)) throw new Error("keine gültigen Daten");
  return d;
}

function shareBase() {
  if (location.protocol === "http:" || location.protocol === "https:") {
    return location.origin + location.pathname;
  }
  return WEB_BASE;   // in der Mac-App: Link zeigt auf die Website
}

function showLink(url, mitBildern) {

  openModal(m => {

      (mitBildern

        : "<b>Ohne Bilder</b>, damit er kurz bleibt (" + (url.length > 1024 ? kb + " KB" : url.length + " Zeichen") + "). Bilder übertragen: „Großer Link mit Bildern“ oder Backup/Import.") +
      "</div>" +
      '<input type="text" id="shareUrl" readonly>' +
      '<div class="hint">Falls das automatische Kopieren nicht geklappt hat: Feld ist markiert, einfach ⌘C drücken. ' +

async function copyText(t) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return true; }
  } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = t;
    ta.style.cssText = "position:fixed;top:-1000px;left:0;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

async function linkKopieren(mitBildern) {
  $("more").classList.remove("open");
  try {
    const url = shareBase() + "#d=" + await packState(mitBildern);
    await copyText(url);
    showLink(url, mitBildern);
  } catch (e) {
    alert("Link konnte nicht erstellt werden: " + (e && e.message ? e.message : e));
  }
}

/* Daten aus einem Link/Code uebernehmen */
function applyPayload(d) {
  state = {
    people: d.people,
    links: Array.isArray(d.links) ? d.links : [],
    wishes: Array.isArray(d.wishes) ? d.wishes : []
  };
  state.wishes.forEach(w => { if (typeof w.note !== "string") w.note = ""; });
  migratePrices();
  expanded.clear();
  if (Array.isArray(d.expanded)) d.expanded.forEach(id => expanded.add(id));
  selPerson = null;
  saveExpanded(); save(); render(); fitToContent();
}

function fragenObErsetzen(d) {
  const leer = !state.people.length && !state.wishes.length;
  if (leer) return true;
  return confirm("Kopierte Daten einfügen?\n\n" + d.people.length + " Personen und " +
    (d.wishes ? d.wishes.length : 0) +
    " Wünsche werden übernommen. Alles, was gerade in diesem Tab steht, wird ersetzt.");
}

/* ---- Link einfügen (funktioniert auch in der Mac-App, wo es keine Adressleiste gibt) ---- */
function codeAus(text) {
  const v = (text || "").trim();
  const i = v.indexOf("#d=");
  return (i >= 0 ? v.slice(i + 3) : v).trim();
}

$("btnPaste").onclick = async () => {
  $("more").classList.remove("open");
  let vorbelegt = "";
  try {
    if (navigator.clipboard && navigator.clipboard.readText) {
      const t = await navigator.clipboard.readText();
      if (t && codeAus(t)) vorbelegt = t.trim();
    }
  } catch (e) {}

  openModal(m => {
    m.innerHTML =
      "<h3>Link einfügen</h3>" +
      '<div class="hint" style="margin:0 0 10px">Füge hier den Link ein, den du vorher mit „Link kopieren“ erzeugt hast (⌘V). ' +
      "Damit kommen alle Zettel, Notizen, Verbindungen und Positionen zurück.</div>" +
      '<label>Link oder Code</label><input type="text" id="pasteUrl" placeholder="https://…/#d=…">' +
      '<div class="hint" id="pasteInfo">Alles, was gerade auf dem Board steht, wird dadurch ersetzt.</div>';

    const inp = m.querySelector("#pasteUrl");
    inp.value = vorbelegt;
    setTimeout(() => { inp.focus(); inp.select(); }, 30);

    const acts = document.createElement("div");
    acts.className = "modalActs";
    acts.appendChild(spacerEl());
    const cancel = document.createElement("button");
    cancel.textContent = "Abbrechen"; cancel.onclick = () => closeModal();
    const ok = document.createElement("button");
    ok.className = "primary"; ok.textContent = "Einfügen";
    ok.onclick = async () => {
      const code = codeAus(inp.value);
      if (!code) { inp.focus(); return; }
      let d;
      try { d = await unpackState(code); }
      catch (e) {
        m.querySelector("#pasteInfo").textContent = "Das ist kein gültiger Wunschbaum-Link.";
        m.querySelector("#pasteInfo").style.color = "#f87171";
        return;
      }
      if (!fragenObErsetzen(d)) return;
      applyPayload(d);
      closeModal();
    };
    inp.addEventListener("keydown", e => { if (e.key === "Enter") ok.click(); });
    acts.append(cancel, ok);
    m.appendChild(acts);
  });
};

/* Beim Start: Daten aus dem Link uebernehmen */
async function importFromHash() {
  const h = location.hash || "";
  if (h.indexOf("#d=") !== 0) return false;
  const code = h.slice(3);
  // Link sofort aus der Adressleiste raeumen, damit ein Neuladen nicht nochmal fragt
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  let d;
  try { d = await unpackState(code); }
  catch (e) { alert("Der Link konnte nicht gelesen werden."); return false; }

  if (!fragenObErsetzen(d)) return false;
  applyPayload(d);
  return true;
}

$("btnImport").onclick = () => { $("more").classList.remove("open"); $("fileIn").click(); };
$("fileIn").onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.people)) throw new Error("bad");
      state = {
        people: d.people,
        links: Array.isArray(d.links) ? d.links : [],
        wishes: Array.isArray(d.wishes) ? d.wishes : []
      };
      state.wishes.forEach(w => { if (typeof w.note !== "string") w.note = ""; });
      migratePrices();
      selPerson = null; expanded.clear(); saveExpanded(); save(); render(); fitToContent();
    } catch (err) { alert("Datei konnte nicht gelesen werden."); }
  };
  r.readAsText(f);
  e.target.value = "";
};

$("btnClearPerson").onclick = () => { selPerson = null; render(); };

$("filterOcc").onclick = e => {
  const b = e.target.closest("button[data-occ]"); if (!b) return;
  fOcc = b.dataset.occ;
  [...$("filterOcc").children].forEach(x => x.classList.toggle("on", x === b));
  renderWishes();
};
$("filterType").onclick = e => {
  const b = e.target.closest("button[data-type]"); if (!b) return;
  fType = b.dataset.type;
  [...$("filterType").querySelectorAll("button[data-type]")].forEach(x => x.classList.toggle("on", x === b));
  renderWishes();
};
$("filterDone").onclick = e => {
  const b = e.target.closest("button[data-done]"); if (!b) return;
  fDone = b.dataset.done;
  [...$("filterDone").querySelectorAll("button[data-done]")].forEach(x => x.classList.toggle("on", x === b));
  renderWishes();
};

window.addEventListener("resize", () => {
  $("btnSide").textContent = isPhone() ? "Liste" : (document.body.classList.contains("noside") ? "Liste einblenden" : "Liste ausblenden");
});

/* ================= Start ================= */
load();
const linkVorhanden = (location.hash || "").indexOf("#d=") === 0;
if (!linkVorhanden && !state.people.length && !state.wishes.length) {
  seedBase();
} else {
  try {
    const ex = JSON.parse(localStorage.getItem(EXKEY) || "[]");
    if (Array.isArray(ex)) ex.forEach(id => expanded.add(id));
  } catch (e) {}
}

// Seitenleiste startet ueberall eingeklappt, bis man sie selbst umschaltet
let sideStored = null;
try { sideStored = localStorage.getItem(UIKEY); } catch (e) {}
setSide(sideStored === null ? true : sideStored === "1");

render();

// Zoom: gespeicherten Wert nehmen, sonst automatisch einpassen
let zStored = null;
try { zStored = localStorage.getItem(ZKEY); } catch (e) {}
// setTimeout statt requestAnimationFrame: rAF laeuft in Hintergrund-Tabs nicht,
// dann wuerde ein im Hintergrund geoeffneter Link erst beim Hinschauen geladen.
setTimeout(async () => {
  let ausLink = false;
  if (linkVorhanden) {
    ausLink = await importFromHash();
    if (!ausLink && !state.people.length && !state.wishes.length) { seedBase(); render(); }
  }
  if (ausLink) return;   // importFromHash hat schon eingepasst
  if (zStored && !isNaN(parseFloat(zStored))) applyZoom(parseFloat(zStored), false);
  else fitToContent();
}, 0);
</script>
